# Desired manifest for the active Talos control-plane VM after bootstrap.
# The Talos ISO PVC is kept below for provenance, but the active VM boots from
# the installed OS disk. Do not put the ISO before the OS disk after Talos has
# been installed, or a VM restart can boot into the installer/live environment
# instead of the configured control-plane node.
#
# Do not add runtime fields such as uid, resourceVersion, creationTimestamp,
# managedFields, finalizers, or status.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cp-01-talos-iso
  namespace: talos-cluster
  annotations:
    harvesterhci.io/imageId: talos-cluster/image-kpz5h
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: lh-df021ebb-bc8e-41dc-bde0-673d98fa0e30
  volumeMode: Block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cp-01-os-disk
  namespace: talos-cluster
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: slow
  volumeMode: Block
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cp-01
  namespace: talos-cluster
  labels:
    harvesterhci.io/creator: harvester
    harvesterhci.io/os: linux
    homelab.io/cluster: talos
    homelab.io/platform: harvester
    homelab.io/role: control-plane
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        harvesterhci.io/vmName: cp-01
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network.harvesterhci.io/mgmt
                    operator: In
                    values:
                      - "true"
      architecture: amd64
      domain:
        cpu:
          cores: 4
          maxSockets: 1
          sockets: 1
          threads: 1
        devices:
          disks:
            - name: os-disk
              bootOrder: 1
              disk:
                bus: virtio
          inputs:
            - bus: usb
              name: tablet
              type: tablet
          interfaces:
            - bridge: {}
              model: virtio
              name: default
        features:
          acpi:
            enabled: true
        firmware:
          bootloader:
            efi:
              persistent: true
              secureBoot: false
        machine:
          type: q35
        memory:
          guest: 8Gi
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: 400m
            memory: 5461Mi
      evictionStrategy: LiveMigrateIfPossible
      hostname: cp-01
      networks:
        - multus:
            networkName: talos-cluster/lan-untagged
          name: default
      terminationGracePeriodSeconds: 120
      volumes:
        - name: os-disk
          persistentVolumeClaim:
            claimName: cp-01-os-disk
