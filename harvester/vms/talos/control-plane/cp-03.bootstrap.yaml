# Bootstrap desired manifest for Talos control-plane VM cp-03.
# The ISO is temporary for first install. After Talos is installed, detach the
# ISO and set the OS disk as bootOrder 1.
#
# Do not add runtime fields such as uid, resourceVersion, creationTimestamp,
# managedFields, finalizers, or status.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cp-03-talos-iso
  namespace: talos-cluster
  annotations:
    harvesterhci.io/imageId: talos-cluster/image-kpz5h
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: lh-df021ebb-bc8e-41dc-bde0-673d98fa0e30
  volumeMode: Block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cp-03-os-disk
  namespace: talos-cluster
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: slow
  volumeMode: Block
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cp-03
  namespace: talos-cluster
  labels:
    harvesterhci.io/creator: harvester
    harvesterhci.io/os: linux
    homelab.io/cluster: talos
    homelab.io/platform: harvester
    homelab.io/placement-host: the-enigmata
    homelab.io/role: control-plane
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        harvesterhci.io/vmName: cp-03
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network.harvesterhci.io/mgmt
                    operator: In
                    values:
                      - "true"
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - the-enigmata
                  - key: homelab.local/placement
                    operator: In
                    values:
                      - the-enigmata
      architecture: amd64
      domain:
        cpu:
          cores: 4
          maxSockets: 1
          sockets: 1
          threads: 1
        devices:
          disks:
            - name: talos-iso
              bootOrder: 1
              cdrom:
                bus: sata
            - name: os-disk
              bootOrder: 2
              disk:
                bus: virtio
          inputs:
            - bus: usb
              name: tablet
              type: tablet
          interfaces:
            - bridge: {}
              model: virtio
              name: default
        features:
          acpi:
            enabled: true
        firmware:
          bootloader:
            efi:
              persistent: true
              secureBoot: false
        machine:
          type: q35
        memory:
          guest: 8Gi
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: 400m
            memory: 5461Mi
      evictionStrategy: LiveMigrateIfPossible
      hostname: cp-03
      networks:
        - multus:
            networkName: talos-cluster/lan-untagged
          name: default
      terminationGracePeriodSeconds: 120
      volumes:
        - name: talos-iso
          persistentVolumeClaim:
            claimName: cp-03-talos-iso
        - name: os-disk
          persistentVolumeClaim:
            claimName: cp-03-os-disk
