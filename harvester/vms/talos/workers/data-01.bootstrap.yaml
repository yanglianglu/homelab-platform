# Desired manifest for Talos data worker VM data-01 after bootstrap.
# data-01 joins homelab-talos as a tainted Kubernetes data node.
# The active VM boots from and attaches only the OS disk. Workload storage uses
# Harvester CSI from the guest Kubernetes cluster.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-01-talos-iso
  namespace: talos-cluster
  annotations:
    harvesterhci.io/imageId: talos-cluster/image-kpz5h
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: lh-df021ebb-bc8e-41dc-bde0-673d98fa0e30
  volumeMode: Block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-01-os-disk
  namespace: talos-cluster
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: slow
  volumeMode: Block
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: data-01
  namespace: talos-cluster
  labels:
    harvesterhci.io/creator: harvester
    harvesterhci.io/os: linux
    homelab.io/cluster: talos
    homelab.io/platform: harvester
    homelab.io/placement-host: the-abundance
    homelab.io/role: data-worker
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        harvesterhci.io/vmName: data-01
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network.harvesterhci.io/mgmt
                    operator: In
                    values:
                      - "true"
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - the-abundance
                  - key: homelab.local/placement
                    operator: In
                    values:
                      - the-abundance
      architecture: amd64
      domain:
        cpu:
          cores: 8
          maxSockets: 1
          sockets: 1
          threads: 1
        devices:
          disks:
            - name: os-disk
              bootOrder: 1
              disk:
                bus: virtio
          inputs:
            - bus: usb
              name: tablet
              type: tablet
          interfaces:
            - bridge: {}
              model: virtio
              name: default
        features:
          acpi:
            enabled: true
        firmware:
          bootloader:
            efi:
              persistent: true
              secureBoot: false
        machine:
          type: q35
        memory:
          guest: 32Gi
        resources:
          limits:
            cpu: "8"
            memory: 32Gi
          requests:
            cpu: 800m
            memory: 21845Mi
      evictionStrategy: LiveMigrateIfPossible
      hostname: data-01
      networks:
        - multus:
            networkName: talos-cluster/lan-untagged
          name: default
      terminationGracePeriodSeconds: 120
      volumes:
        - name: os-disk
          persistentVolumeClaim:
            claimName: data-01-os-disk
