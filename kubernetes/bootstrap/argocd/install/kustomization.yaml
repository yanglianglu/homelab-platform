apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.1/manifests/install.yaml
patches:
  - path: patch-control-plane-toleration.yaml
    target:
      kind: Deployment
  - path: patch-control-plane-toleration-statefulset.yaml
    target:
      kind: StatefulSet
