apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets
resources:
  - https://github.com/external-secrets/external-secrets/releases/download/v2.4.1/external-secrets.yaml
patches:
  - path: patch-cert-controller-namespace-args.yaml
  - path: patch-webhook-namespace-args.yaml
  - path: patch-control-plane-toleration.yaml
    target:
      kind: Deployment
