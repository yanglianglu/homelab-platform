apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: whoami-tls-backend
  namespace: apps
spec:
  secretName: whoami-tls-backend-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - whoami-tls
    - whoami-tls.apps
    - whoami-tls.apps.svc
    - whoami-tls.apps.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: homelab-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
