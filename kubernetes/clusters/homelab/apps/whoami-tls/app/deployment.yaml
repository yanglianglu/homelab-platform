apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-tls
  namespace: apps
  labels:
    app.kubernetes.io/name: whoami-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami-tls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami-tls
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: backend-tls
              mountPath: /etc/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: whoami-tls-nginx
        - name: backend-tls
          secret:
            secretName: whoami-tls-backend-tls
