apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-service-lb
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip-service-lb
    app.kubernetes.io/component: service-load-balancer
    app.kubernetes.io/part-of: kube-vip
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-service-lb
      app.kubernetes.io/component: service-load-balancer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip-service-lb
        app.kubernetes.io/component: service-load-balancer
        app.kubernetes.io/part-of: kube-vip
    spec:
      hostNetwork: true
      serviceAccountName: kube-vip
      nodeSelector:
        homelab.local/node-class: general
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.1.2
          imagePullPolicy: IfNotPresent
          args:
            - manager
          env:
            - name: vip_arp
              value: "true"
            - name: vip_interface
              value: enp1s0
            - name: vip_cidr
              value: "32"
            - name: cp_enable
              value: "false"
            - name: cp_namespace
              value: kube-system
            - name: svc_enable
              value: "true"
            - name: vip_leaderelection
              value: "true"
            - name: svc_election
              value: "true"
            - name: vip_leaseduration
              value: "15"
            - name: vip_renewdeadline
              value: "10"
            - name: vip_retryperiod
              value: "2"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
