apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: homelab-internal-ca
spec:
  sources:
    - secret:
        name: homelab-internal-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
      metadata:
        labels:
          app.kubernetes.io/component: trust-bundle
          homelab.local/trust-bundle: internal-ca
    namespaceSelector:
      matchLabels:
        homelab.local/internal-ca-trust: "true"
